<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board</title>
  <link rel="icon" href="https://asyncker.github.io/Board/assets/img/board.png" type="image/png">
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="threads.css">
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="header-left">
        <button class="header-burger-icon" id="burgerMenuBtn" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" width="26" height="26" stroke="currentColor">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <a href="?" class="header-logo">
          <svg width="30" height="30" viewBox="0 0 200 200">
            <g transform="rotate(45, 100, 100)">
              <path d="M 100 100 L 100 0 A 100 100 0 0 0 100 200 Z" fill="#B3E31C" />
              <path d="M 100 100 L 100 0 A 100 100 0 0 1 100 200 Z" fill="#23B04D" />
            </g>
          </svg>
          <div class="header-logo-text" id="brand">Board</div>
        </a>
        <a href="?" class="header-mobile">
          <div class="header-logo-text" id="groupNameMobile">Board</div>
        </a>
      </div>
      <div class="header-right">
        <div class="header-logo-text" id="groupName">Board</div>
      </div>
    </div>
    <div class="main">
      <div class="sidebar" id="sidebarLeft">
        <div class="sidebar-links" id="sidebarLinks">
          <div class="sidebar-head" id="sidebarAccount">ACCOUNT</div>
          <div class="sidebar-link" id="profileSettingBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span id="sidebarMyProfile">My Profile</span>
          </div>
          <div class="sidebar-link" id="archivedSettingBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M4 4h16v2H4V4zm2 4h12v2H6V8zm3 4h6v2H9v-2z" stroke-linecap="round"></path>
              <path d="M5 12h14v8H5z" stroke-linejoin="round"></path>
            </svg>
            <span id="sidebarArchive">Archived</span>
          </div>
          <div onclick="" class="sidebar-link" id="searchSettingBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <circle cx="10" cy="10" r="7"></circle>
              <path d="M15 15l5 5"></path>
            </svg>
            <span id="sidebarSearch">Search</span>
          </div>
          <div class="sidebar-head" id="sidebarThreads">THREADS</div>
        </div>
      </div>
      <div class="main-content" id="mainContent">
        <div class="posts-feed">
          <div class="thread-post-container" id="threadPost" style="display: none;">
            <div class="thread-post">
              <div class="thread-post-avatar" id="threadAvatar"></div>
              <div>
                <div class="thread-post-header">
                  <span class="thread-post-username" id="threadUsername">loading...</span>
                  <span class="post-date" id="threadDate">Just now</span>
                </div>
                <div class="thread-post-text" id="threadText">...</div>
                <div class="post-stats">
                  <div class="post-stat-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                      <path d="M3 12h18M12 3v18"></path>
                    </svg>
                    <span id="threadCommentsCount">1</span>
                    <span>comments</span>
                  </div>
                  <div class="post-stat-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <span id="threadViewsCount">1</span>
                    <span>views</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="posts-header posts-header-padding" id="groupPost" style="display: none; background: linear-gradient(180deg, #000000, #000000);">
            <div class="posts-icon" id="groupAvatar"></div>
            <div class="posts-text">
              <h1 class="posts-name" id="groupTitle">...</h1>
              <div class="posts-description" id="groupText">Loading...</div>
              <div class="posts-stats"><strong></strong></div>
              <div class="posts-header-actions" id="headerActions">
                <button class="posts-action-pill" id="favoriteGlobalBtn">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2z" stroke-linejoin="round"></path>
                  </svg>
                  <span id="like">Favorite</span>
                </button>
                <button class="posts-action-pill" id="archiveGlobalBtn">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M4 4h16v2H4V4zm2 4h12v2H6V8zm3 4h6v2H9v-2z" stroke-linecap="round"></path>
                    <path d="M5 12h14v8H5z" stroke-linejoin="round"></path>
                  </svg>
                  <span id="archive">Archive</span>
                </button>
              </div>
            </div>
          </div>
          <div id="posts"></div>
        </div>
        <div class="input-area">
          <div class="input-attachments-preview-area" id="attachmentPreviewArea"></div>
          <div class="input-row">
            <input type="file" id="attachFileInput" multiple="multiple" accept="*" style="display: none;" />
            <button class="input-attach-btn" id="attachFileBtn" type="button" aria-label="Attach files">
              <svg viewBox="0 0 24 24" fill="none" width="22" height="22" stroke="currentColor">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke-linecap="round"></path>
              </svg>
            </button>
            <div class="input-textarea-wrapper">
              <textarea class="input-textarea-dynamic" id="inputTextareaThread" rows="1" placeholder="Write a message..."></textarea>
            </div>
            <button class="input-send-btn" id="inputSendThreadBtn">
              <svg viewBox="0 0 24 24" fill="none" width="18" height="18" stroke="currentColor">
                <path d="M5 3v18l15-9L5 3z" fill="white"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="modalProfile">
    <div class="modal-container">
      <div class="modal-header">
        <h2 id="modalEditProfile">Edit Profile</h2>
        <button class="modal-close" id="modalCloseBtn"><svg width="34" height="18" viewBox="0 0 24 24" stroke="currentColor"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
      </div>
      <div class="modal-body">
        <div class="modal-avatar-section">
          <div class="modal-avatar-preview" id="modalUploadAvatarBtn" onclick="modalAvatarInput.click()"></div>
          <input type="file" id="modalAvatarInput" accept="image/jpeg,image/png,image/gif,image/webp" style="display:none;">
        </div>
        <div class="modal-input-group">
          <label for="modalUsername" id="modalEditUsername">👤 Username</label>
          <input type="text" id="modalUsername" class="modal-input" placeholder="Your username" maxlength="32">
        </div>
        <div class="modal-input-group">
          <label for="modalToken" id="modalEditAccessToken">🗝️ Access token</label>
          <input type="text" id="modalToken" class="modal-input" placeholder="Your token" maxlength="32">
        </div>
        <div class="modal-input-group">
          <label for="modalColor" id="modalEditUsernameColor">🎨 Username color</label>
          <input type="color" id="modalColor" class="modal-input-color">
        </div>
        <div class="modal-input-group" style="display: none;">
          <label for="modalLanguage" id="modalEditLanguage">🌐 Language</label>
          <select id="modalLanguage" class="modal-input">
            <option value="en">English</option>
            <option value="ru">Русский</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn modal-secondary-btn" id="modalCancelBtn">Cancel</button>
        <button class="modal-btn modal-primary-btn" id="modalSaveProfileBtn">Save</button>
      </div>
    </div>
  </div>
  <script src="utils.js"></script>
  <script src="api.js"></script>
  <script src="main.js"></script>
</body>
</html>
